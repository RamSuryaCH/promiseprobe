<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notes</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #efece4; color: #1c1915; font: 16px/1.45 "Segoe UI", sans-serif; }
    main { width: min(440px, calc(100% - 32px)); background: white; padding: 28px 24px 22px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .lede { margin: 0 0 18px; color: #5e584f; }
    label { display: block; font-size: 13px; margin-bottom: 6px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 96px; padding: 10px 12px; border: 1px solid #d9d3c8; border-radius: 10px; font: inherit; resize: vertical; }
    button { margin-top: 12px; background: #1c1915; color: white; border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: default; }
    #status { min-height: 1.4em; font-weight: 650; }
    h2 { font-size: 13px; font-weight: 650; margin: 22px 0 6px; color: #5e584f; }
    ul { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Notes</h1>
    <p class="lede">Jot something down.</p>
    <label for="note">Note</label>
    <textarea id="note"></textarea>
    <button type="button" id="save" data-promiseprobe-action>Save</button>
    <p id="status" data-testid="status" role="status"></p>
    <h2>In the store</h2>
    <ul id="saved"></ul>
  </main>
  <script>
    // The indicator waits for a response. Retries reuse one idempotency key.
    // The server conditionally inserts that key, so a lost ack cannot duplicate the note.
    const ATTEMPT_TIMEOUT_MS = 2000;
    const status = document.getElementById('status');
    const note = document.getElementById('note');
    const saved = document.getElementById('saved');
    const button = document.getElementById('save');
    let inflight = false;
    let keyFor = '';
    let key = '';

    button.addEventListener('click', () => { void onSave(); });

    async function onSave() {
      const text = note.value.trim();
      if (!text || inflight) return;
      inflight = true;
      button.disabled = true;
      if (keyFor !== text) {
        keyFor = text;
        key = crypto.randomUUID();
      }
      status.textContent = 'Saving…';
      const ok = await send(text, key);
      if (ok) {
        status.textContent = 'Saved ✓';
        await refresh();
      } else {
        status.textContent = 'Not saved';
        button.disabled = false;
        inflight = false;
      }
    }

    async function attempt(text, idempotencyKey) {
      const res = await fetch('/api/notes', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'Idempotency-Key': idempotencyKey,
        },
        body: JSON.stringify({ text, idempotencyKey }),
        signal: AbortSignal.timeout(ATTEMPT_TIMEOUT_MS),
      });
      await res.json().catch(() => undefined);
      return res.ok;
    }

    async function send(text, idempotencyKey) {
      try {
        return await attempt(text, idempotencyKey);
      } catch {
        try {
          return await attempt(text, idempotencyKey);
        } catch {
          return false;
        }
      }
    }

    async function refresh() {
      const res = await fetch('/api/notes');
      const body = await res.json();
      saved.replaceChildren();
      for (const item of body.notes) {
        const li = document.createElement('li');
        li.textContent = item.text;
        saved.appendChild(li);
      }
    }

    void refresh();
  </script>
</body>
</html>
